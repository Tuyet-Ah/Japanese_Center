<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSMART - Kết quả học tập</title>
    <link rel="stylesheet" href="./CSS/Result.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo-nav">
            <div class="logo">
                <img src="https://via.placeholder.com/90" alt="JSMART Logo" class="logo-img">
                <span class="logo-text">JSMART</span>
            </div>
            <nav class="nav-links">
                <a href="Home.html">Trang chủ</a>
                <a href="#">Khóa học</a>
                <a href="Document.html">Tài liệu</a>
                <a href="#">Đề thi online</a>
                <a href="#">JLPT</a>
            </nav>
        </div>
        <div class="header-icons">
            <img src="https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?q=80&w=100" alt="Avatar mây" class="header-avatar">
            <i class="fa-solid fa-bag-shopping bag-icon"></i>
        </div>
    </header>

    <main class="main-container">
        <aside class="sidebar">
            <div class="user-profile-summary">
                <img src="https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?q=80&w=150" alt="Avatar" class="profile-avatar">
                <h2 class="user-name">Trịnh Thị Tuyết Anh</h2>
                <p class="user-id">ID: 34578223</p>
            </div>

            <div class="menu-section">
                <p class="menu-title active">Tài khoản cá nhân</p>
                <ul class="menu-list">
                    <li class="menu-item" id="btn-profile">
                        <i class="fa-regular fa-user"></i> Thông tin cá nhân
                    </li>
                    <li class="menu-item" id="btn-courses">
                        <i class="fa-solid fa-graduation-cap"></i> Khóa học đã mua
                    </li>
                    <li class="menu-item active" id="btn-results">
                        <i class="fa-solid fa-book"></i> Kết quả học tập
                    </li>
                </ul>
            </div>

            <button class="logout-btn">ĐĂNG XUẤT</button>
        </aside>

        <section class="content-area">
            <div class="results-section">
                <h1 class="section-title">THỐNG KÊ KẾT QUẢ THI</h1>
                
                <div class="results-table">
                    <div class="table-header">
                        <div class="col-exam">Đề thi</div>
                        <div class="col-date">Ngày làm</div>
                        <div class="col-score">Kết quả</div>
                        <div class="col-action"></div>
                    </div>
                    
                    <div class="table-row">
                        <div class="col-exam">Đề từ vựng N5</div>
                        <div class="col-date">18/05/2025</div>
                        <div class="col-score">45/50</div>
                        <div class="col-action">
                            <a href="#" class="detail-link">Xem chi tiết</a>
                        </div>
                    </div>
                    
                    </div>
            </div>
        </section>
    </main>

    <script src="./JS/Result.js"></script>
</body>
</html>
