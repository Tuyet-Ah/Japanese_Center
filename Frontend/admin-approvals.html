<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Duyệt Người Dùng | Admin</title>
	<link rel="stylesheet" href="CSS/admin-approvals.css">
	<script defer src="JS/script.js"></script>
	<script defer src="JS/admin-approvals.js"></script>
</head>

<body>
	<header class="topbar">
		<div class="container topbar-inner">
			<a class="brand" href="admin-home.html">
				<img src="assets/Logo.png" alt="JSMART Logo" class="brand-logo">
				<span>JSMART<small>Quản trị hệ thống</small></span>
			</a>
			<nav class="nav">
				<a href="admin-home.html">Trang chủ</a>
				<a href="admin-approvals.html">Quản lý tài khoản</a>
				<a href="admin-courses.html">Quản lý khóa học</a>
				<a href="admin-quizzes.html">Quản lý đề thi</a>
				<a href="admin-forum.html">Quản lý thảo luận</a>
				<a href="admin-dashboard.html">Thống kê & Báo cáo</a>
			</nav>
			<div class="sidebar-footer">
				<button id="adminLogout" class="menu-item logout-btn">
					<span class="menu-icon">🚪</span>
					<span>Đăng Xuất</span>
				</button>
			</div>
		</div>
	</header>

	<main class="admin-main container" style="padding-top: 20px;">
			<header class="admin-header">
				<h1>Duyệt Người Dùng Mới</h1>
				<span class="header-info">Tổng: <strong id="pendingAdminsCount">0</strong> đơn chờ duyệt</span>
			</header>

			<div class="admin-content">
				<!-- Approvals List -->
				<section class="approvals-section">
					<div id="pendingAdminsList" class="approvals-list">
						<p class="pending-empty">Dang tai danh sach...</p>
					</div>
				</section>
			</div>
	</main>

	<div id="confirmModal" class="modal-backdrop" hidden>
		<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
			<h3 id="confirmModalTitle">Xac nhan</h3>
			<p id="confirmModalMessage">Ban chac chan?</p>
			<div class="modal-actions">
				<button id="confirmModalCancel" class="btn btn-outline">Huy</button>
				<button id="confirmModalOk" class="btn btn-danger">Dong y</button>
			</div>
		</div>
	</div>

</body>
</html>
