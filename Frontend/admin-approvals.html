<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quản lý Tài khoản | Admin</title>
	<link rel="stylesheet" href="CSS/admin-approvals.css">
	<script defer src="JS/script.js"></script>
	<script defer src="JS/admin-approvals.js"></script>
</head>

<body>
	<header class="topbar">
		<div class="container topbar-inner">
			<a class="brand" href="admin-home.html">
				<img src="assets/Logo.png" alt="JSMART Logo" class="brand-logo">
				<span>JSMART<small>Quản trị hệ thống</small></span>
			</a>
			<nav class="nav">
				<a href="admin-home.html">Trang chủ</a>
				<a href="admin-statistics.html">Thống kê</a>
				<a href="admin-approvals.html">Quản lý tài khoản</a>
				<a href="admin-courses.html">Quản lý khóa học</a>
				<a href="admin-quizzes.html">Quản lý đề thi</a>
				<a href="admin-forum.html">Quản lý thảo luận</a>
			</nav>
			<div class="actions">
				<div class="admin-user-section">
					<span class="user-greeting">⚙️ <span id="adminDisplayName">Admin</span></span>
					<a href="admin-profile.html" class="icon-btn" title="Hồ sơ Admin" style="color:var(--primary-dark); font-size:1.3rem; text-decoration:none; opacity:0.9;">👤</a>
				</div>
			</div>
		</div>
	</header>

	<main class="admin-main container" style="padding-top: 20px;">
			<header class="admin-header">
				<h1>Quản lý Tài khoản</h1>
				<span class="header-info">Tổng: <strong id="pendingAdminsCount">0</strong> tài khoản</span>
			</header>

			<!-- Search & Filter Bar -->
			<div class="filter-bar">
				<input type="text" id="searchInput" class="filter-input" placeholder="Tìm kiếm theo tên, email...">
				<select id="roleFilter" class="filter-select">
					<option value="all">Tất cả vai trò</option>
					<option value="admin">Admin</option>
					<option value="teacher">Giáo viên</option>
					<option value="student">Học viên</option>
				</select>
			</div>

			<div class="admin-content">
				<!-- Accounts List -->
				<section class="approvals-section">
					<div id="pendingAdminsList" class="approvals-list">
						<p class="pending-empty">Đang tải danh sách...</p>
					</div>
				</section>
			</div>
	</main>

	<div id="confirmModal" class="modal-backdrop" hidden>
		<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
			<h3 id="confirmModalTitle">Xác nhận</h3>
			<p id="confirmModalMessage">Bạn chắc chắn?</p>
			<div class="modal-actions">
				<button id="confirmModalCancel" class="btn btn-outline">Hủy</button>
				<button id="confirmModalOk" class="btn btn-danger">Đồng ý</button>
			</div>
		</div>
	</div>

</body>
</html>
