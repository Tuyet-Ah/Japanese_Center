<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quản Lý Quiz | Admin</title>
	<link rel="stylesheet" href="CSS/admin-quizzes.css">
	<script defer src="JS/script.js"></script>
	<script defer src="JS/admin-quizzes.js"></script>
</head>

<body>
	<header class="topbar">
		<div class="container topbar-inner">
			<a class="brand" href="admin-home.html">
				<img src="assets/Logo.png" alt="JSMART Logo" class="brand-logo">
				<span>JSMART<small>Quản trị hệ thống</small></span>
			</a>
			<nav class="nav">
				<a href="admin-home.html">Trang chủ</a>
				<a href="admin-approvals.html">Quản lý tài khoản</a>
				<a href="admin-courses.html">Quản lý khóa học</a>
				<a href="admin-exams.html">Quản lý đề thi</a>
				<a href="admin-forum.html">Quản lý thảo luận</a>
			</nav>
			<div class="sidebar-footer">
				<button id="adminLogout" class="menu-item logout-btn">
					<span class="menu-icon">🚪</span>
					<span>Đăng Xuất</span>
				</button>
			</div>
		</div>
	</header>

	<main class="admin-main container" style="padding-top: 20px;">
		<header class="admin-header">
			<h1>Quản Lý Quiz</h1>
			<button id="addQuizBtn" class="btn btn-primary">+ Thêm Quiz</button>
		</header>

		<div class="admin-content">
			<!-- Add/Edit Form -->
			<section class="admin-form-section" id="quizFormSection" style="display: none;">
				<h2>Thêm/Sửa Quiz</h2>
				<form id="quizForm" class="admin-form">
					<div class="form-row">
						<div class="form-group">
							<label for="quizName">Tên Quiz *</label>
							<input type="text" id="quizName" placeholder="VD: Ngữ pháp N5" required>
						</div>
						<div class="form-group">
							<label for="quizLevel">Cấp Độ *</label>
							<select id="quizLevel" required>
								<option value="">-- Chọn cấp độ --</option>
								<option value="N5">N5</option>
								<option value="N4">N4</option>
								<option value="N3">N3</option>
								<option value="N2">N2</option>
								<option value="N1">N1</option>
							</select>
						</div>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label for="quizCategory">Danh Mục *</label>
							<select id="quizCategory" required>
								<option value="">-- Chọn danh mục --</option>
								<option value="grammar">Ngữ Pháp</option>
								<option value="vocabulary">Từ Vựng</option>
								<option value="listening">Nghe Hiểu</option>
								<option value="reading">Đọc Hiểu</option>
								<option value="writing">Viết</option>
								<option value="kanji">Kanji</option>
							</select>
						</div>
						<div class="form-group">
							<label for="quizQuestions">Số Câu Hỏi *</label>
							<input type="number" id="quizQuestions" placeholder="VD: 30" min="1" required>
						</div>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label for="quizDuration">Thời Gian (phút) *</label>
							<input type="number" id="quizDuration" placeholder="VD: 20" min="1" required>
						</div>
						<div class="form-group">
							<label for="quizPassingScore">Điểm Đạt (%) *</label>
							<input type="number" id="quizPassingScore" placeholder="VD: 70" min="0"
								max="100" required>
						</div>
					</div>

					<div class="form-row">
						<div class="form-group" style="grid-column: 1 / -1;">
							<label for="quizDesc">Mô Tả</label>
							<textarea id="quizDesc" placeholder="Mô tả chi tiết quiz" rows="4"></textarea>
						</div>
					</div>

					<div class="form-actions">
						<button type="submit" class="btn btn-primary">Lưu Quiz</button>
						<button type="button" class="btn btn-outline" id="cancelQuizBtn">Hủy</button>
					</div>
				</form>
			</section>

			<!-- Quizzes Table -->
			<section class="admin-table-section">
				<h2>Danh Sách Quiz</h2>
				<div class="admin-filter-bar">
					<div class="filter-group">
						<label for="quizSearchInput">Tìm kiếm</label>
						<input type="text" id="quizSearchInput" placeholder="Nhap ten quiz...">
					</div>
					<div class="filter-group">
						<label for="quizLevelFilter">Cấp độ</label>
						<select id="quizLevelFilter">
							<option value="">Tất cả</option>
							<option value="N5">N5</option>
							<option value="N4">N4</option>
							<option value="N3">N3</option>
							<option value="N2">N2</option>
							<option value="N1">N1</option>
						</select>
					</div>
					<div class="filter-group">
						<label for="quizTypeFilter">Loai quiz</label>
						<select id="quizTypeFilter">
							<option value="">Tat ca</option>
							<option value="lesson">Bai tap bai hoc</option>
							<option value="chapter">Kiem tra chuong</option>
							<option value="final">Thi cuoi khoa</option>
							<option value="practice">Luyen thi</option>
						</select>
					</div>
					<button id="quizFilterBtn" class="btn btn-small">Loc</button>
					<button id="quizFilterReset" class="btn btn-small btn-outline">Xoa loc</button>
				</div>
				<div class="table-responsive">
					<table class="admin-table">
						<thead>
							<tr>
								<th>STT</th>
								<th>Tên Quiz</th>
								<th>Cấp Độ</th>
								<th>Câu Hỏi</th>
								<th>Thời Gian (phut)</th>
								<th>Luot lam</th>
								<th>Loại Quiz</th>
								<th>Hành Động</th>
							</tr>
						</thead>
						<tbody id="quizzesTableBody">
							<tr>
								<td colspan="8">Dang tai quiz...</td>
							</tr>
						</tbody>
					</table>
				</div>
			</section>
		</div>
	</main>
</body>

</html>
