<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quản Lý Khóa Học | Admin</title>
	<link rel="stylesheet" href="CSS/admin-courses.css">
	<script defer src="JS/script.js"></script>
	<script defer src="JS/admin-courses.js"></script>
</head>

<body>
	<div class="admin-layout">
		<!-- Admin Sidebar -->
		<aside class="admin-sidebar">
			<div class="sidebar-brand">
				<span class="sidebar-icon">⚙️</span>
				<h2>Admin Panel</h2>
			</div>
			<nav class="sidebar-menu">
				<a href="admin-dashboard.html" class="menu-item">
					<span class="menu-icon">📊</span>
					<span>Dashboard</span>
				</a>
				<a href="admin-courses.html" class="menu-item active">
					<span class="menu-icon">📚</span>
					<span>Quản Lý Khóa Học</span>
				</a>
				<a href="admin-quizzes.html" class="menu-item">
					<span class="menu-icon">📝</span>
					<span>Quản Lý Quiz</span>
				</a>
				<a href="admin-approvals.html" class="menu-item">
					<span class="menu-icon">✅</span>
					<span>Duyệt Người Dùng</span>
				</a>
				<a href="admin-forum.html" class="menu-item">
					<span class="menu-icon">💬</span>
					<span>Duyệt Forum</span>
				</a>
			</nav>
			<div class="sidebar-footer">
				<button id="adminLogout" class="menu-item logout-btn">
					<span class="menu-icon">🚪</span>
					<span>Đăng Xuất</span>
				</button>
			</div>
		</aside>

		<!-- Admin Main Content -->
		<main class="admin-main">
			<header class="admin-header">
				<h1>Quản Lý Khóa Học</h1>
				<button id="addCourseBtn" class="btn btn-primary">+ Thêm Khóa Học</button>
			</header>

			<div class="admin-content">
				<!-- Add/Edit Form -->
				<section class="admin-form-section" id="courseFormSection" style="display: none;">
					<h2>Thêm/Sửa Khóa Học</h2>
					<form id="courseForm" class="admin-form">
						<div class="form-row">
							<div class="form-group">
								<label for="courseName">Tên Khóa Học *</label>
								<input type="text" id="courseName" placeholder="VD: N5 Beginner Journey"
									required>
							</div>
							<div class="form-group">
								<label for="courseLevel">Cấp Độ *</label>
								<select id="courseLevel" required>
									<option value="">-- Chọn cấp độ --</option>
									<option value="N5">N5</option>
									<option value="N4">N4</option>
									<option value="N3">N3</option>
									<option value="N2">N2</option>
									<option value="N1">N1</option>
								</select>
							</div>
						</div>

						<div class="form-row">
							<div class="form-group">
								<label for="coursePrice">Giá (VNĐ) *</label>
								<input type="number" id="coursePrice" placeholder="VD: 2400000"
									required>
							</div>
						</div>

						<div class="form-row">
							<div class="form-group" style="grid-column: 1 / -1;">
								<label for="courseDesc">Mô Tả</label>
								<textarea id="courseDesc" placeholder="Mô tả khóa học"
									rows="4"></textarea>
							</div>
						</div>

						<div class="course-builder">
							<div class="course-builder-header">
								<h3>Thiết Kế Khóa Học</h3>
								<button type="button" id="addChapterBtn" class="btn btn-small">+ Thêm
									Chương</button>
							</div>
							<div id="chaptersContainer" class="chapters-container"></div>
						</div>

						<div class="form-actions">
							<button type="submit" class="btn btn-primary">Lưu Khóa Học</button>
							<button type="button" class="btn btn-outline" id="cancelFormBtn">Hủy</button>
						</div>
					</form>
				</section>

				<!-- Courses Table -->
				<section class="admin-table-section">
					<h2>Danh Sách Khóa Học</h2>
					<div class="admin-filter-bar">
						<div class="filter-group">
							<label for="courseSearchInput">Tìm kiếm</label>
							<input type="text" id="courseSearchInput" placeholder="Nhap ten khoa hoc...">
						</div>
						<div class="filter-group">
							<label for="courseLevelFilter">Cấp độ</label>
							<select id="courseLevelFilter">
								<option value="">Tất cả</option>
								<option value="N5">N5</option>
								<option value="N4">N4</option>
								<option value="N3">N3</option>
								<option value="N2">N2</option>
								<option value="N1">N1</option>
							</select>
						</div>
						<div class="filter-group">
							<label for="courseMinPrice">Gia tu</label>
							<input type="number" id="courseMinPrice" min="0" placeholder="VD: 500000">
						</div>
						<div class="filter-group">
							<label for="courseMaxPrice">Gia den</label>
							<input type="number" id="courseMaxPrice" min="0" placeholder="VD: 2000000">
						</div>
						<button id="courseFilterBtn" class="btn btn-small">Loc</button>
						<button id="courseFilterReset" class="btn btn-small btn-outline">Xoa loc</button>
					</div>
					<div class="table-responsive">
						<table class="admin-table">
							<thead>
								<tr>
									<th>STT</th>
									<th>Tên Khóa Học</th>
									<th>Cấp Độ</th>
									<th>Giá</th>
									<th>Học Viên</th>
									<th>Hành Động</th>
								</tr>
							</thead>
							<tbody id="coursesTableBody">
								<tr>
									<td colspan="6">Dang tai khoa hoc...</td>
								</tr>
							</tbody>
						</table>
					</div>
				</section>
			</div>
		</main>
	</div>

</body>

</html>
