<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSMART | Đăng nhập</title>

  <link rel="stylesheet" href="CSS/login.css">
  <script defer src="JS/script.js"></script>
  <script defer src="JS/login.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="Home.html">
        <span class="brand-mark">日</span>
        <span>JSMART<small>Trung tâm giảng dạy tiếng Nhật</small></span>
      </a>
      <nav class="nav">
        <a href="Home.html">Trang chủ</a>
        <a href="courses.html">Khóa học</a>
        <a href="exams.html">Đề thi</a>
        <a href="jlpt.html">JLPT</a>
        <a href="materials.html">Tài liệu</a>
      </nav>
      <div class="actions">
        <a data-profile-link href="profile.html" class="icon-btn" hidden title="Trang cá nhân">👤</a>
        <a data-cart-link href="cart.html" class="icon-btn cart-icon" hidden title="Giỏ hàng">🛒<span data-cart-count
            class="badge">0</span></a>
        <div data-auth-actions class="auth-buttons">
          <a class="btn btn-outline" href="login.html">Đăng nhập</a>
          <a class="btn btn-primary" href="register.html">Đăng ký</a>
        </div>
        <div data-user-actions class="user-section" style="display: none;">
          <span class="user-greeting">Xin chào, <span data-username></span></span>
          <button data-logout-btn class="btn btn-outline">Đăng xuất</button>
        </div>
      </div>
    </div>
  </header>

  <main class="cute-login-wrapper">
    <div class="decor-circle decor-1"></div>
    <div class="decor-circle decor-2"></div>
    <div class="decor-star">✨</div>
    <div class="decor-star star-2">💖</div>

    <div class="container cute-form-container">
      <section class="card cute-form-card" data-login-panel>
        <div class="mascot-wrapper">
          <img src="assets/icon.png" alt="Cute Mascot" class="mascot-img">
        </div>
        <span class="cute-badge">Chào mừng trở lại! </span>
        <h2>Đăng nhập tài khoản</h2>
        <form data-auth-form data-api-auth>
          <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" name="loginUsername" placeholder="Nhập tên đăng nhập..." required>
          </div>
          <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="loginPassword" placeholder="Nhập mật khẩu ..." required>
          </div>
          <div class="form-group">
            <label>Vai trò</label>
            <select name="loginRole" data-login-role>
              <option value="student">Học viên</option>
              <option value="admin">Quản trị viên</option>
            </select>
          </div>
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox"> Ghi nhớ mình nhé
            </label>
            <a href="#" class="forgot-link">Quên mật khẩu? 🥺</a>
          </div>
          <button class="btn btn-cute" type="submit">Đăng nhập ngay</button>
          <p data-form-message class="cute-message"></p>
        </form>
        <div class="auth-switch cute-switch">
          <span>Bạn chưa có tài khoản?</span>
          <a class="link-button" href="register.html">Đăng ký ngay thôi! 🌸</a>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
