<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSMART | Tài liệu học tập</title>
  <link rel="stylesheet" href="CSS/materials.css">
  <script defer src="JS/script.js"></script>
  <script defer src="JS/materials.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="Home.html">
        <span class="brand-mark">日</span>
        <span>JSMART<small>Trung tâm giảng dạy tiếng Nhật</small></span>
      </a>
      <nav class="nav">
        <a href="Home.html">Trang chủ</a>
        <a href="courses.html">Khóa học</a>
        <a href="exams.html">Đề thi</a>
        <a href="jlpt.html">JLPT</a>
        <a href="materials.html">Tài liệu</a>
      </nav>
      <div class="actions">
        <a data-profile-link href="profile.html" class="icon-btn" hidden title="Trang cá nhân">👤</a>
        <a data-cart-link href="cart.html" class="icon-btn cart-icon" hidden title="Giỏ hàng">🛒<span data-cart-count
            class="badge">0</span></a>
        <div data-auth-actions class="auth-buttons">
          <a class="btn btn-outline" href="login.html">Đăng nhập</a>
          <a class="btn btn-primary" href="register.html">Đăng ký</a>
        </div>
        <div data-user-actions class="user-section" style="display: none;">
          <span class="user-greeting">Xin chào, <span data-username></span></span>
          <button data-logout-btn class="btn btn-outline">Đăng xuất</button>
        </div>
      </div>
    </div>
  </header>

  <main class="materials-page">
    <div class="materials-container">

      <!-- Bộ từ vựng -->
      <section class="category-section" data-material-category="vocab">
        <h2 class="category-title title-vocab">Bộ từ vựng</h2>
        <div class="carousel-container">
          <button class="nav-btn btn-prev" data-carousel-nav="-1">⟨</button>
          <div class="carousel-track" data-material-track="vocab"></div>
          <button class="nav-btn btn-next" data-carousel-nav="1">⟩</button>
        </div>
      </section>

      <!-- Luyện nghe -->
      <section class="category-section" data-material-category="listen">
        <h2 class="category-title title-listen">Luyện nghe</h2>
        <div class="carousel-container">
          <button class="nav-btn btn-prev" data-carousel-nav="-1">⟨</button>
          <div class="carousel-track" data-material-track="listen"></div>
          <button class="nav-btn btn-next" data-carousel-nav="1">⟩</button>
        </div>
      </section>

      <!-- Luyện viết -->
      <section class="category-section" data-material-category="write">
        <h2 class="category-title title-write">Luyện viết</h2>
        <div class="carousel-container">
          <button class="nav-btn btn-prev" data-carousel-nav="-1">⟨</button>
          <div class="carousel-track" data-material-track="write"></div>
          <button class="nav-btn btn-next" data-carousel-nav="1">⟩</button>
        </div>
      </section>

    </div>
  </main>
</body>

</html>
