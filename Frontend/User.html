<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân</title>
    <link rel="stylesheet" href="./CSS/User.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo-nav">
            <div class="logo">
                <img src="image/logoweb.PNG" alt="JSMART Logo" class="logo-img">
            </div>
            <nav class="nav-links">
                <a href="Home.html">Trang chủ</a>
                <a href="#">Khóa học</a>
                <a href="Document.html">Tài liệu</a>
                <a href="#">Đề thi online</a>
                <a href="#">JLPT</a>
            </nav>
        </div>
        <div class="header-icons">
            <img src="https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?q=80&w=100" alt="Avatar mây" class="header-avatar">
            <i class="fa-solid fa-bag-shopping bag-icon"></i>
        </div>
    </header>

    <main class="main-container">
        
        <aside class="sidebar">
            <div class="user-profile-summary">
                <img src="image/2.jpg" alt="Avatar" class="profile-avatar">
                <h2 class="user-name">Trịnh Thị Tuyết Anh</h2>
                <p class="user-id">ID: 34578223</p>
            </div>

            <div class="menu-section">
                <p class="menu-title active">Tài khoản cá nhân</p>
                <ul class="menu-list">
                    <li class="menu-item" id="btn-profile">
                        <i class="fa-regular fa-user"></i> Thông tin cá nhân
                    </li>
                    <li class="menu-item" id="btn-courses">
                        <i class="fa-solid fa-graduation-cap"></i> Khóa học đã mua
                    </li>
                    <li class="menu-item" id="btn-result">
                        <i class="fa-solid fa-book"></i> Kết quả học tập
                    </li>
                </ul>
            </div>

            <button class="logout-btn">ĐĂNG XUẤT</button>
        </aside>

        <section class="content-area">
            <div class="info-section">
                <h1 class="section-title">THÔNG TIN HỌC VIÊN</h1>
                
                <div class="info-grid">
                    <div class="info-row">
                        <span class="info-label">Họ tên</span>
                        <span class="info-value">Trịnh Thị Tuyết Anh</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Ngày sinh</span>
                        <span class="info-value">01/05/2005</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value">tanh01052005@gmail.com</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Số điện thoại</span>
                        <span class="info-value">0357513055</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Giới tính</span>
                        <span class="info-value">Nữ</span>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-update">Cập nhật thông tin</button>
                    <button class="btn btn-password">Thay đổi mật khẩu</button>
                </div>
            </div>

            <div class="decor-image">
                <img src="image/2.jpg" alt="Bầu trời mây">
            </div>
        </section>

    </main>

    <script src="./JS/User.js"></script>
</body>
</html>
