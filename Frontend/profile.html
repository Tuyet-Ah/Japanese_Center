<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSMART | Trang cá nhân</title>
  <link rel="stylesheet" href="CSS/profile.css">
  <script defer src="JS/script.js"></script>
  <script defer src="JS/profile.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="Home.html">
        <span class="brand-mark">日</span>
        <span>JSMART<small>Trung tâm giảng dạy tiếng Nhật</small></span>
      </a>
      <nav class="nav">
        <a href="Home.html">Trang chủ</a>
        <a href="courses.html">Khóa học</a>
        <a href="exams.html">Đề thi</a>
        <a href="jlpt.html">JLPT</a>
        <a href="materials.html">Tài liệu</a>
      </nav>
      <div class="actions">
        <a data-profile-link href="profile.html" class="icon-btn" hidden title="Trang cá nhân">👤</a>
        <a data-cart-link href="cart.html" class="icon-btn cart-icon" hidden title="Giỏ hàng">🛒<span data-cart-count
            class="badge">0</span></a>
        <div data-auth-actions class="auth-buttons">
          <a class="btn btn-outline" href="login.html">Đăng nhập</a>
          <a class="btn btn-primary" href="register.html">Đăng ký</a>
        </div>
        <div data-user-actions class="user-section" style="display: none;">
          <span class="user-greeting">Xin chào, <span data-username></span></span>
          <button data-logout-btn class="btn btn-outline">Đăng xuất</button>
        </div>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container form-wrap">
      <section class="card form-card">
        <span class="badge">Thông tin cá nhân</span>
        <h2>Hồ sơ học viên</h2>
        <div class="profile-list">
          <div class="item"><strong>Họ tên: </strong><span>Nguyễn Minh Anh</span></div>
          <div class="item"><strong>Email: </strong><span>minhanh@email.com</span></div>
          <div class="item"><strong>Trình độ: </strong><span>N4</span></div>
          <div class="item"><strong>Khóa đang học: </strong><span>Giao tiếp cuối tuần</span></div>
        </div>
      </section>
      <section class="card form-card">
        <span class="badge">Cập nhật nhanh</span>
        <h2>Chỉnh sửa thông tin</h2>
        <form data-auth-form>
          <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" placeholder="Nhập họ tên">
          </div>
          <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" placeholder="Nhập số điện thoại">
          </div>
          <div class="form-group">
            <label>Mục tiêu học tập</label>
            <textarea rows="4" placeholder="Ví dụ: thi JLPT N3 trong 6 tháng"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
          <p data-form-message></p>
        </form>
      </section>
    </div>
  </main>
</body>

</html>
