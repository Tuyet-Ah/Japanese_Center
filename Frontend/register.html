<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSMART | Đăng ký</title>
  <link rel="stylesheet" href="CSS/register.css">
  <script defer src="JS/script.js"></script>
  <script defer src="JS/register.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="Home.html">
        <img src="assets/Logo.png" alt="JSMART Logo" class="brand-logo">
        <span>JSMART<small>Trung tâm giảng dạy tiếng Nhật</small></span>
      </a>
      <nav class="nav">
        <a href="Home.html">Trang chủ</a>
        <a href="courses.html">Khóa học</a>
        <a href="exams.html">Đề thi</a>
        <a href="forum.html">Thảo luận</a>
        <a href="materials.html">Tài liệu</a>
      </nav>
      <div class="actions">
        <a data-profile-link href="profile.html" class="icon-btn" hidden title="Trang cá nhân">👤</a>
        <a data-cart-link href="cart.html" class="icon-btn cart-icon" hidden title="Giỏ hàng">🛒<span data-cart-count
            class="badge">0</span></a>
        <div data-auth-actions class="auth-buttons">
          <a class="btn btn-outline" href="login.html">Đăng nhập</a>
          <a class="btn btn-primary" href="register.html">Đăng ký</a>
        </div>
        <div data-user-actions class="user-section" style="display: none;">
          <span class="user-greeting">Xin chào, <span data-username></span></span>
          <button data-logout-btn class="btn btn-outline">Đăng xuất</button>
        </div>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container form-wrap">
      <section class="card form-card">
        <span class="badge">Tạo tài khoản</span>
        <h2>Đăng ký tài khoản mới</h2>
        <form data-auth-form data-api-auth>
          <div class="form-group">
            <label>Vai trò <span class="required">*</span></label>
            <select id="registerRole" required>
              <option value="student">Học viên</option>
              <option value="admin">Quản trị viên</option>
            </select>
            <small id="adminRegisterNote" style="display: none; color: var(--muted);">
              Tài khoản quản trị sẽ được duyệt trước khi đăng nhập.
            </small>
          </div>
          <div class="form-group">
            <label>Họ tên <span class="required">*</span></label>
            <input id="registerName" type="text" placeholder="Nguyễn An" required>
          </div>
          <div class="form-group">
            <label>Tên đăng nhập <span class="required">*</span></label>
            <input id="registerUsername" type="text" placeholder="Nhập tên đăng nhập" required>
          </div>
          <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input id="registerEmail" type="email" placeholder="name@email.com" required>
          </div>
          <div class="form-group">
            <label>Số điện thoại <span class="required">*</span></label>
            <input id="registerPhone" type="tel" placeholder="0900123456" required>
          </div>
          <div class="form-group">
            <label>Giới tính <span class="required">*</span></label>
            <select id="registerGender" required>
              <option value="">-- Chọn giới tính --</option>
              <option>Nam</option>
              <option>Nữ</option>
              <option>Khác</option>
            </select>
          </div>
          <div class="form-group" id="registerGoalGroup">
            <label>Mục tiêu quan tâm <span class="required">*</span></label>
            <select id="registerGoal" required>
              <option value="">-- Chọn mục tiêu --</option>
              <option>N5 cơ bản</option>
              <option>N4 giao tiếp</option>
              <option>N3 nâng cao</option>
              <option>JLPT luyện thi</option>
              <option>Tiếng Nhật công việc</option>
            </select>
          </div>
          <div class="form-group">
            <label>Mật khẩu <span class="required">*</span></label>
            <input id="registerPassword" type="password" placeholder="Tạo mật khẩu" required>
          </div>
          <div class="form-group">
            <label>Xác nhận mật khẩu <span class="required">*</span></label>
            <input id="registerPasswordConfirm" type="password" placeholder="Nhập lại mật khẩu" required>
          </div>
          <button class="btn btn-primary" type="submit">Đăng ký</button>
          <p data-form-message></p>
        </form>
        <div class="auth-switch">
          <span>Đã có tài khoản?</span>
          <a class="link-button" href="login.html">Quay lại đăng nhập</a>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
