<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSMART | Giỏ hàng</title>
  <link rel="stylesheet" href="CSS/cart.css">
  <script defer src="JS/script.js"></script>
  <script defer src="JS/cart.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="Home.html">
        <span class="brand-mark">日</span>
        <span>JSMART<small>Trung tâm giảng dạy tiếng Nhật</small></span>
      </a>
      <nav class="nav">
        <a href="Home.html">Trang chủ</a>
        <a href="courses.html">Khóa học</a>
        <a href="exams.html">Đề thi</a>
        <a href="jlpt.html">JLPT</a>
        <a href="materials.html">Tài liệu</a>
      </nav>
      <div class="actions">
        <a data-profile-link href="profile.html" class="icon-btn" hidden title="Trang cá nhân">👤</a>
        <a data-cart-link href="cart.html" class="icon-btn cart-icon" hidden title="Giỏ hàng">🛒<span data-cart-count
            class="badge">0</span></a>
        <div data-auth-actions class="auth-buttons">
          <a class="btn btn-outline" href="login.html">Đăng nhập</a>
          <a class="btn btn-primary" href="register.html">Đăng ký</a>
        </div>
        <div data-user-actions class="user-section" style="display: none;">
          <span class="user-greeting">Xin chào, <span data-username></span></span>
          <button data-logout-btn class="btn btn-outline">Đăng xuất</button>
        </div>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container form-wrap">
      <section class="card form-card">
        <span class="badge">Khóa học đã chọn</span>
        <h2>Giỏ hàng của bạn</h2>
        <div class="cart-list" data-cart-list></div>
      </section>
      <aside class="cart-summary">
        <h3>Tổng thanh toán</h3>
        <p>Kiểm tra lại các khóa học trước khi tiến hành thanh toán.</p>
        <div class="discount-section">
          <label for="discountInput">Mã giảm giá</label>
          <div class="discount-input-wrapper">
            <input type="text" id="discountInput" placeholder="Nhập mã (VD: JSMART10)">
            <button class="btn btn-outline btn-apply-discount" onclick="applyDiscountCode()">Áp dụng</button>
          </div>
          <div id="discountMessage"></div>
          <p class="discount-display">Giảm giá: <span id="discountAmount">-0 VND</span></p>
        </div>
        
        <h2 data-cart-total>0 VND</h2>
        <p data-checkout-message style="margin: 8px 0 0; font-weight: 700;"></p>
        <div class="actions">
          <button class="btn btn-outline" data-clear-cart>Xóa giỏ</button>
          <button class="btn btn-primary" type="button" data-checkout-btn>Thanh toán</button>
        </div>
      </aside>
    </div>
  </main>
</body>

</html>
